<body>
<div class="nav-bar">
    <div class="left">
        Aot Chanthorn
    </div>
    <div class="right">
        <button> <a href="index.html">home</a></button>
        <button> <a href="about.html">about</a></button>
        <button> <a href="resume.html">resume</a></button>
        <button> <a href="projects.html">projects</a></button>

<div class="home-content">
    <div class="left">
        <div id="label">
            <div>Applied Mathmatics @ UC Berkeley</div></div>
        <div id="desc">
            <div> Archery Enjoyer And Avid <br> Problem Solver.</div></div>

        <div id="graph">
            <svg id="chart" viewBox="0 0 1000 400" aria-label="performance-chart">
                  <text 
                    fill="#fff"
                    id="chart-title"
                    x="400"               
                    y="20"              
                    text-anchor="middle"  
                    font-size="24"
                    >
                    Skill Growth Trend
                </text>
                <g class="grid" id="grid"></g>
                <g class="axis" id="axes"></g>

                <defs>
                    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#ff4d4f"/>
                    <stop offset="100%" stop-color="#ff2a6d"/>
                    </linearGradient>
                </defs>

                <path id="line" fill="none" stroke="url(#grad)" stroke-width="3.5" stroke-linecap="round"/>
                <circle id="dot" r="5.5" fill="#ff4d4f" />
                <text id="val" class="label" fill="white"></text>
            </svg>
        </div>
        <div id="overview">
            <button>OVERVIEW</button>
        </div>
    </div>
    <div class="right">
        <div id="title">PROJECTS :</div>
    </div>
</div>
