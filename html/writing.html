<main class="page-shell page-main">
  <div class="page-head memos-horse-head">
    <h1 class="page-title">Thoughts</h1>
    <div class="horse-lane" data-horse-lane aria-hidden="true">
      <span class="horse-sprite"></span>
    </div>
  </div>

  <div class="updates-head">
    <div class="updates-count" data-updates-count><!-- static:memo-count --><!-- /static:memo-count --></div>
  </div>
  <div class="updates-list" data-life-updates-list data-page="0"><!-- static:memos --><!-- /static:memos --></div>
  <div class="updates-pagination">
    <!-- static:memo-pagination -->
    <a class="clink updates-button" href="writing.html" data-updates-newer aria-disabled="true" tabindex="-1">View Newer</a>
    <a class="clink updates-button" href="writing.html" data-updates-older aria-disabled="true" tabindex="-1">View Older</a>

  <div class="page-tail">
    <a class="clink" href="contact.html">Next: Contact</a>
    <a class="clink" href="work.html">Back to Work</a>
  </div>

<div class="project-modal memo-modal" id="memo-modal" hidden>
  <div class="project-modal-backdrop" data-close-memo-modal="true"></div>
  <div class="project-modal-card" role="dialog" aria-modal="true" aria-labelledby="memo-modal-title">
    <button class="project-modal-close" id="memo-modal-close" type="button" aria-label="Close memo popup">&times;</button>
    <div class="project-modal-tag" id="memo-modal-tag"></div>
    <h2 class="project-modal-title" id="memo-modal-title"></h2>
    <p class="project-modal-summary" id="memo-modal-summary"></p>
    <div class="project-modal-media" id="memo-modal-media" hidden></div>
    <p class="project-modal-details" id="memo-modal-details" hidden></p>
  </div>
</div>
