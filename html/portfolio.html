<main class="page-shell hero-page">
  <section class="system-graph" aria-labelledby="system-title" data-system-graph>
    <header class="system-heading">
      <h1 id="system-title" data-entrance-title>Aot V1-core Architecture</h1>
    </header>
    <div class="system-canvas" data-graph-canvas>
      <svg class="system-svg" viewBox="0 0 1280 860" role="group" aria-labelledby="system-title" aria-describedby="system-svg-desc" data-graph-svg>
        <desc id="system-svg-desc">Hover or focus a node to see its title. Select the unconnected, gently pulsing node to show every title at once. Select another node to animate and sound its incoming and outgoing connections, or select an edge to isolate that connection. Click empty space or press Escape to restore the silent full graph. Pulses move from each source to its destinations. Satisfaction is the final output.</desc>
      </svg>
      <div class="system-tooltip" role="tooltip" id="system-tooltip" hidden data-graph-tooltip></div>
    </div>
    <div class="system-note" data-node-note>
      <p class="system-note-line" data-note-line hidden aria-hidden="true">
        <span class="system-note-prefix">&gt;</span>
        <span class="system-note-copy"><span data-note-text></span><span class="system-note-caret" data-note-caret hidden>▌</span></span>
      </p>
      <p class="system-sr-only" role="status" aria-live="polite" aria-atomic="true" data-note-announcement></p>
    </div>
    <noscript><p class="system-noscript">Enable JavaScript to explore the interactive system graph.</p></noscript>
  </section>

  <div class="hero-sub">
    <div class="hero-actions">
      <a class="clink" href="about.html">About</a>
      <a class="clink" href="work.html">Work</a>
      <a class="clink" href="writing.html">Memos</a>
      <a class="clink" href="contact.html">Contact</a>
    </div>
    <div class="hero-meta">Current Happenings</div>
  </div>

  <section class="home-grid" data-home-updates></section>
  <div class="home-grid-note">
    <a class="clink" href="writing.html">View All Updates</a>
  </div>
</main>
