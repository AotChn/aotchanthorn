<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Work</title>
<script src="../js/ga4.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/portfolio.css">
<link rel="stylesheet" href="../css/projects.css">
<link rel="stylesheet" href="../css/page-transition.css">
<script src="../js/animation-preferences.js"></script>
<script src="../js/audio-preferences.js"></script>
<script src="../js/page-reveal.js"></script>
<script src="../js/projects-entrance.js"></script>
</head>
<body>

<nav>
  <button class="animations-toggle" type="button" aria-label="Transition animations" aria-pressed="true">
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path d="m12 2 3.09 6.26 6.91 1-5 4.87 1.18 6.87L12 17.76l-6.18 3.24L7 14.13 2 9.26l6.91-1Z"/>
    </svg>
  </button>
  <button class="volume-toggle" type="button" aria-label="Site sound" aria-pressed="true" title="Mute site sounds">
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path d="M11 5 6 9H3v6h3l5 4Z"/>
      <g class="volume-on"><path d="M15 8a6 6 0 0 1 0 8M18 5a10 10 0 0 1 0 14"/></g>
      <path class="volume-off" d="m16 9 6 6m0-6-6 6"/>
    </svg>
  </button>
  <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav-links" aria-label="Toggle navigation">
    <span class="nav-toggle-lines" aria-hidden="true">
      <span class="nav-toggle-line"></span>
      <span class="nav-toggle-line"></span>
      <span class="nav-toggle-line"></span>
    </span>
  </button>
  <div class="nav-actions" id="site-nav-links">
    <a class="clink small" href="portfolio.html">Home</a>
    <a class="clink small" href="about.html">About</a>
    <a class="clink small active" href="work.html">Work</a>
    <a class="clink small" href="writing.html">Memos</a>
    <a class="clink small" href="contact.html">Contact</a>
  </div>
</nav>

<main class="page-shell page-main">
  <div class="page-head">
    <h1 class="page-title">Projects</h1>
  </div>

  <section class="project-history" aria-label="Project history">
    <div class="project-history-toolbar">
      <div class="project-history-controls">
        <label class="project-view-filter">
          <span class="project-visually-hidden">Filter projects by type</span>
          <select data-project-filter disabled>
            <option value="all">All projects</option>
            <option value="work">Professional</option>
            <option value="personal">Personal</option>
            <option value="school">School</option>
            <option value="competition">Competition</option>
          </select>
        </label>
        <label class="project-view-filter">
          <span class="project-visually-hidden">Sort projects by date</span>
          <select data-project-sort disabled>
            <option value="newest">Newest first</option>
            <option value="oldest">Oldest first</option>
          </select>
        </label>
      </div>
      <span class="project-count" data-project-count role="status"><!-- static:project-count --><!-- /static:project-count --></span>
    </div>
    <div class="project-history-table" data-project-history>
      <svg class="project-history-graph" aria-hidden="true" focusable="false" data-project-history-graph></svg>
      <table class="project-table">
        <caption class="project-visually-hidden">Projects, their function, type, and last update. Select a project to view its details.</caption>
        <colgroup>
          <col class="project-col-graph">
          <col class="project-col-type">
          <col class="project-col-name">
          <col class="project-col-function">
          <col class="project-col-updated">
        </colgroup>
        <thead>
          <tr>
            <th scope="col"><span class="project-visually-hidden">Timeline</span></th>
            <th scope="col">Type</th>
            <th scope="col">Project</th>
            <th scope="col">Function</th>
            <th scope="col">Last updated</th>
          </tr>
        </thead>
        <tbody data-projects-list><!-- static:projects --><!-- /static:projects --></tbody>
      </table>
      <p class="project-history-empty" data-project-empty hidden></p>
    </div>
  </section>

  <div class="page-tail">
    <a class="clink" href="writing.html">Next: Memos</a>
    <a class="clink" href="about.html">Back to About</a>
  </div>
</main>

<div class="project-modal" id="project-modal" hidden>
  <div class="project-modal-backdrop" data-close-modal="true"></div>
  <div class="project-modal-card" role="dialog" aria-modal="true" aria-labelledby="project-modal-title">
    <button class="project-modal-close" type="button" aria-label="Close project popup">&times;</button>
    <div class="project-lock" id="project-modal-lock" hidden>
      <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Details locked" focusable="false">
        <rect x="10" y="21" width="28" height="22" rx="4"/>
        <path d="M16 21v-8a8 8 0 0 1 16 0v8"/>
        <circle cx="24" cy="31" r="2"/><path d="M24 33v3"/>
      </svg>
      <label class="project-access-label" for="project-access-code">access code required</label>
      <input class="project-access-input" id="project-access-code" type="text" placeholder="Enter access code" autocomplete="off" autocapitalize="none" spellcheck="false">
    </div>
    <div id="project-modal-content">
      <div class="project-modal-tag" id="project-modal-tag"></div>
      <h2 class="project-modal-title" id="project-modal-title"></h2>
      <p class="project-modal-summary" id="project-modal-summary"></p>
      <div class="project-modal-media" id="project-modal-media" hidden></div>
      <p class="project-modal-details" id="project-modal-details"></p>
      <div class="project-modal-stack" id="project-modal-stack"></div>
    </div>
  </div>
</div>

<footer class="page-footer">
  <span>Current as of September 27, 2026</span>
  <span>Sardine</span>
</footer>

<script src="../js/system-graph-config.js"></script>
<script src="../js/content-urls.js"></script>
<script src="../js/project-sort.js"></script>
<script src="../js/projects.js"></script>
<script src="../js/nav.js"></script>
<script src="../js/system-graph-transition-sound.js"></script>
<script src="../js/projects-transition.js"></script>
<script src="../js/home-return.js"></script>

</body>
</html>
